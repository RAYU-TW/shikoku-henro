    position: absolute; top: 10px; right: 10px; z-index: 1000;

    position: absolute; top: 8px; right: 12px; cursor: pointer;

  }
  .info-panel .close-btn:hover { color: #333; }

  .tag-hotel { background: #cce5ff; color: #004085; }
  .tag-ep { background: #e2e3e5; color: #383d41; }

  .day-nav {
    position: absolute; top: 10px; left: 60px; z-index: 1000;
    display: flex; flex-wrap: wrap; gap: 4px; max-width: 600px;
  }
  .day-btn {
    padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
    background: white; cursor: pointer; font-size: 12px;
    font-family: "Microsoft JhengHei", sans-serif;
  }
  .day-btn:hover { background: #e3f2fd; }
  .day-btn.active { background: #1976d2; color: white; border-color: #1976d2; }
  .day-btn.all { background: #f5f5f5; font-weight: bold; }

  .popup-content { font-size: 13px; line-height: 1.5; max-width: 280px; }
  .popup-content h3 { font-size: 15px; margin-bottom: 4px; }
  .popup-content .meta { color: #666; font-size: 12px; margin-bottom: 6px; }
  .popup-content a { color: #1976d2; }

  #loadingBar {
    position: absolute; top: 0; left: 0; z-index: 2000;
    width: 100%; height: 4px; background: #e0e0e0;
  }
  #loadingProgress {
    height: 100%; width: 0; background: #1976d2;
    transition: width 0.3s;
  }
  #loadingText {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 2000; background: rgba(25,118,210,0.9); color: white;
    padding: 4px 16px; border-radius: 4px; font-size: 13px;
  }

  .leaflet-control-layers { font-family: "Microsoft JhengHei", sans-serif; font-size: 13px; }
  .leaflet-control-layers-expanded { padding: 8px 12px; min-width: 220px; }

// ===== OSRM WALKING ROUTE FETCHER =====
async function fetchWalkingRoute(waypoints) {
  const coords = waypoints.map(p => `${p[1]},${p[0]}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.code === 'Ok' && data.routes && data.routes[0]) {
      return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    }
  } catch (e) {
    console.warn('OSRM fetch failed:', e);
  }
  return waypoints;
}

// Split long waypoint arrays into chunks for OSRM (max ~25 per request)
async function fetchRouteSegmented(waypoints, chunkSize) {
  const allCoords = [];
  for (let i = 0; i < waypoints.length - 1; i += chunkSize - 1) {
    const chunk = waypoints.slice(i, i + chunkSize);
    if (chunk.length < 2) break;
    const coords = await fetchWalkingRoute(chunk);
    if (allCoords.length > 0) coords.shift();
    allCoords.push(...coords);
  }
  return allCoords;
}

}

// ===== DAY NAV =====
function buildDayNav() {
  const nav = document.getElementById('dayNav');
  const allBtn = document.createElement('button');
  allBtn.className = 'day-btn all active';
  allBtn.textContent = '全部';
  allBtn.onclick = () => filterByDay(null);
  nav.appendChild(allBtn);
  for (let d = 1; d <= 17; d++) {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.textContent = `D${d}`;
    btn.title = `Day${d} (${dayData[d].date}) ${dayData[d].dist}`;
    btn.onclick = () => filterByDay(d);
    nav.appendChild(btn);
  }
}

function filterByDay(day) {
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  if (day === null) {
    document.querySelector('.day-btn.all').classList.add('active');
  } else {
    document.querySelectorAll('.day-btn')[day].classList.add('active');
  }

  const allItems = [
    ...layerTemples.getLayers(),
    ...layerJCHotels.getLayers(),
    ...layerVocusHotels.getLayers(),
    ...layerDiary46Hotels.getLayers(),
    ...layerHikingNoteHotels.getLayers(),
    ...layerPois.getLayers()
  ];

  allItems.forEach(m => {
    if (!m._data) return;
    if (day === null || m._data.day === day) {
      m.setOpacity ? m.setOpacity(1) : (m._icon && (m._icon.style.opacity = '1'));
    } else {
      m.setOpacity ? m.setOpacity(0.15) : (m._icon && (m._icon.style.opacity = '0.15'));
    }
  });

  if (day !== null) {
    showDayInfo(day);
    const dayItems = allItems.filter(m => m._data && m._data.day === day);
    if (dayItems.length > 0) {
      const bounds = L.latLngBounds(dayItems.map(m => m.getLatLng()));
      map.fitBounds(bounds.pad(0.3));
    }
  } else {
    document.getElementById('infoPanel').style.display = 'none';
    const tBounds = L.latLngBounds(temples.map(t => [t.lat, t.lng]));
    map.fitBounds(tBounds.pad(0.1));
  }
}

function showDayInfo(day) {
  const d = dayData[day];
  const dt = temples.filter(t => t.day === day);
  const dh = [...jcHotels, ...vocusHotels, ...diary46Hotels, ...hikingNoteHotels].filter(h => h.day === day);
  const dp = pois.filter(p => p.day === day);
  const eps = [...new Set([...dt.map(t=>t.ep), ...dh.map(h=>h.ep)])];

  let html = `<h2>Day${day}（${d.date}）</h2>`;
  html += `<p><strong>距離：</strong>${d.dist}</p>`;
  html += `<p><strong>重點：</strong>${d.note}</p>`;
  if (eps.length) { html += '<p>'; eps.forEach(ep => { html += `<a href="${videoUrls[ep]}" target="_blank" class="tag tag-ep">ep.${ep} 影片</a> `; }); html += '</p>'; }
  if (dt.length) { html += '<p><strong>札所：</strong>'; dt.forEach(t => { html += `<span class="tag" style="background:#ffcdd2">${t.n}番 ${t.name}</span> `; }); html += '</p>'; dt.filter(t=>t.warn).forEach(w => { html += `<p><span class="tag tag-danger">${w.n}番 ${w.warn}</span></p>`; }); }
  if (dh.length) { html += '<p><strong>住宿：</strong></p>'; dh.forEach(h => { const u = h.url ? ` <a href="${h.url}" target="_blank">[官網]</a>` : ''; html += `<p><span class="tag tag-hotel">${h.name}</span>${u}<br>${h.note}</p>`; }); }
  if (dp.length) { html += '<p><strong>景點：</strong></p>'; dp.forEach(p => { html += `<p><span class="tag tag-warning">${p.name}</span><br>${p.note}</p>`; }); }

  document.getElementById('infoPanelContent').innerHTML = html;
  document.getElementById('infoPanel').style.display = 'block';
}
